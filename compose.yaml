services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: tabel-db:latest
    container_name: tabel-db
    restart: always
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    env_file: .env
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - 'archive_command=pgbackrest --stanza=tabel archive-push %p'
      - -c
      - archive_timeout=60
    volumes:
      - pgdata:/var/lib/postgresql
      - pgbackups:/var/lib/pgbackrest
    # Указываем адрес нашего нового рабочего DNS-сервера
    # dns:
    #   - 192.168.1.242

  app:
    build: .
    container_name: tabel-app
    restart: always
    # Прямого проброса нет — наружу смотрит только nginx (8080).
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ORIGIN: ${ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    env_file: .env
    depends_on:
      - db
    # Указываем адрес нашего нового рабочего DNS-сервера
    # dns:
    #   - 192.168.1.242

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: tabel-nginx
    restart: always
    ports:
      - 80:80
      # HTTPS — раскомментировать вместе с TLS-блоком в nginx.conf
      # - 443:443
    depends_on:
      - app

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/mettem/tabel/pgdata
  pgbackups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/mettem/tabel/pgbackups
