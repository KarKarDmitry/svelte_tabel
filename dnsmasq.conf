# Связываем домен с IP-адресом вашего сайта (основным IP компьютера)
address=/mettem.lan/192.168.1.42
address=/www.mettem.lan/192.168.1.42

# КРИТИЧНО: заставляем dnsmasq слушать ТОЛЬКО второй IP-адрес
listen-address=192.168.1.242

# Разрешаем отвечать на запросы из локальной сети (для других устройств)
local-service

# Игнорируем внутренний resolv.conf контейнера
no-resolv
