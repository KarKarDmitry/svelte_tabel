# Конфигурация pgBackRest для стека «табель»
# Репозиторий: том pgbackups, смонтированный в /var/lib/pgbackrest

[global]
repo1-path=/var/lib/pgbackrest/repo
# Полное — раз в неделю (пятница). Храним 4 полных = 4 недели.
repo1-retention-full=4
# Диффы — 2 раза в день (~13/неделю). Храним за те же 4 недели.
repo1-retention-diff=52
start-fast=y
log-level-console=info

[tabel]
# PGDATA контейнера postgres:18
pg1-path=/var/lib/postgresql/18/docker
# Роль БД (в образе создаётся только POSTGRES_USER из .env)
pg1-user=karkardmitry
